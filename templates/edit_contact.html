<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Contact</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08); }
        h1 { margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, textarea { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
        .actions { display: flex; gap: 10px; margin-top: 25px; }
        button, a { padding: 10px 16px; border: 0; border-radius: 6px; font: inherit; text-decoration: none; cursor: pointer; }
        button { background: #007bff; color: white; }
        a { background: #e9ecef; color: #222; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Edit Contact</h1>
        <form method="post">
            <label for="name">Name</label>
            <input id="name" type="text" name="name" value="{{ contact.name }}" required>

            <label for="email">Email</label>
            <input id="email" type="email" name="email" value="{{ contact.email }}" required>

            <label for="phone">Phone</label>
            <input id="phone" type="text" name="phone" value="{{ contact.phone }}">

            <label for="visitor_type">Visitor Type</label>
            <select id="visitor_type" name="visitor_type" required>
                {% for value, label in [("buyer", "Buyer"), ("seller", "Seller"), ("neighbor", "Neighbor"), ("just-looking", "Just Looking")] %}
                <option value="{{ value }}" {% if contact.visitor_type == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>

            <label for="currently">Currently</label>
            <select id="currently" name="currently" required>
                <option value="renting" {% if contact.currently == "renting" %}selected{% endif %}>Renting</option>
                <option value="own" {% if contact.currently == "own" %}selected{% endif %}>Own</option>
            </select>

            <label for="timeline">Timeline</label>
            <select id="timeline" name="timeline" required>
                <option value="0-3" {% if contact.timeline == "0-3" %}selected{% endif %}>0-3 months</option>
                <option value="3-6" {% if contact.timeline == "3-6" %}selected{% endif %}>3-6 months</option>
                <option value="6-12" {% if contact.timeline == "6-12" %}selected{% endif %}>6-12 months</option>
                <option value="browsing" {% if contact.timeline == "browsing" %}selected{% endif %}>Just browsing</option>
            </select>

            <label for="preapproval">Pre-approval</label>
            <select id="preapproval" name="preapproval" required>
                <option value="yes" {% if contact.preapproval == "yes" %}selected{% endif %}>Yes</option>
                <option value="no" {% if contact.preapproval == "no" %}selected{% endif %}>No</option>
                <option value="unknown" {% if contact.preapproval == "unknown" %}selected{% endif %}>Not sure</option>
            </select>

            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="5">{{ contact.notes }}</textarea>

            <div class="actions">
                <button type="submit">Save Contact</button>
                <a href="{{ url_for('dashboard') }}">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
