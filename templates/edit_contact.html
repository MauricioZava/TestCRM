<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if is_new %}New Contact{% else %}Edit Contact{% endif %} | Lead Workspace</title>
    <style>
        :root { --ink: #172033; --muted: #66748a; --canvas: #e8edf3; --paper: #fffdf8; --line: #d9e1ea; --blue: #2563c7; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; padding: 24px 14px; color: var(--ink); background: radial-gradient(circle at top right, #f8f0df 0, transparent 34%), var(--canvas); font-family: "DM Sans", Arial, sans-serif; }
        .container { width: 100%; max-width: 620px; margin: 0 auto; padding: clamp(20px, 5vw, 34px); border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.95); box-shadow: 0 14px 34px rgba(23,32,51,.08); }
        h1 { margin: 0; font-family: "Space Grotesk", Arial, sans-serif; font-size: clamp(28px, 7vw, 40px); letter-spacing: -.03em; }
        .intro { margin: 8px 0 22px; color: var(--muted); line-height: 1.5; }
        label { display: block; margin-top: 15px; color: var(--ink); font-size: 13px; font-weight: 800; }
        input, select, textarea { display: block; box-sizing: border-box; width: 100%; min-height: 46px; margin-top: 6px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px; background: #fbfdff; color: var(--ink); font: inherit; font-size: 16px; }
        textarea { min-height: 120px; resize: vertical; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .row-2 label { margin-top: 15px; }
        .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .row-3 label { margin-top: 15px; }
        input:focus, select:focus, textarea:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 4px rgba(37,99,199,.12); }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
        button, a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 11px 16px; border: 0; border-radius: 9px; font: inherit; font-weight: 800; text-decoration: none; cursor: pointer; }
        button { background: var(--blue); color: white; }
        a { background: #e9ecef; color: var(--ink); }
        @media (max-width: 440px) { body { padding: 12px 8px; } .container { padding: 20px 16px; border-radius: 12px; } .actions { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main class="container">
        <h1>{% if is_new %}New Contact{% else %}Edit Contact{% endif %}</h1>
        <p class="intro">{% if is_new %}Add a contact and save their lead information.{% else %}Update contact details and save the latest lead information.{% endif %}</p>
        <form method="post" action="{% if is_new %}{{ url_for('create_contact') }}{% endif %}">
            <div class="row-2">
                <div>
                    <label for="first_name">First Name</label>
                    <input id="first_name" type="text" name="first_name" value="{{ contact.first_name }}" required>
                </div>
                <div>
                    <label for="last_name">Last Name</label>
                    <input id="last_name" type="text" name="last_name" value="{{ contact.last_name }}" required>
                </div>
            </div>

            <label for="email">Email</label>
            <input id="email" type="email" name="email" value="{{ contact.email }}" required>

            <div class="row-2">
                <div>
                    <label for="phone">Phone</label>
                    <input id="phone" type="tel" name="phone" value="{{ contact.phone }}" autocomplete="tel">
                </div>
                <div>
                    <label for="alternate_phone">Alternate Phone</label>
                    <input id="alternate_phone" type="tel" name="alternate_phone" value="{{ contact.alternate_phone }}" autocomplete="tel">
                </div>
            </div>

            <div class="row-2">
                <div>
                    <label for="preferred_contact_method">Preferred Contact Method</label>
                    <select id="preferred_contact_method" name="preferred_contact_method">
                        <option value="email" {% if contact.preferred_contact_method == "email" %}selected{% endif %}>Email</option>
                        <option value="text" {% if contact.preferred_contact_method == "text" %}selected{% endif %}>Text</option>
                        <option value="phone" {% if contact.preferred_contact_method == "phone" %}selected{% endif %}>Phone</option>
                    </select>
                </div>
                <div>
                    <label for="best_time_to_contact">Best Time to Contact</label>
                    <select id="best_time_to_contact" name="best_time_to_contact">
                        <option value="morning" {% if contact.best_time_to_contact == "morning" %}selected{% endif %}>Morning (8am - 12pm)</option>
                        <option value="afternoon" {% if contact.best_time_to_contact == "afternoon" %}selected{% endif %}>Afternoon (12pm - 4pm)</option>
                        <option value="evening" {% if contact.best_time_to_contact == "evening" %}selected{% endif %}>Evening (4pm - 8pm)</option>
                        <option value="anytime" {% if contact.best_time_to_contact == "anytime" or not contact.best_time_to_contact %}selected{% endif %}>Anytime</option>
                    </select>
                </div>
            </div>

            <div class="row-2">
                <div>
                    <label for="lead_status">Lead Status</label>
                    <select id="lead_status" name="lead_status">
                        <option value="new" {% if contact.lead_status == "new" or not contact.lead_status %}selected{% endif %}>New</option>
                        <option value="contacted" {% if contact.lead_status == "contacted" %}selected{% endif %}>Contacted</option>
                        <option value="qualified" {% if contact.lead_status == "qualified" %}selected{% endif %}>Qualified</option>
                        <option value="nurturing" {% if contact.lead_status == "nurturing" %}selected{% endif %}>Nurturing</option>
                        <option value="under-contract" {% if contact.lead_status == "under-contract" %}selected{% endif %}>Under Contract</option>
                        <option value="closed" {% if contact.lead_status == "closed" %}selected{% endif %}>Closed</option>
                        <option value="lost" {% if contact.lead_status == "lost" %}selected{% endif %}>Lost</option>
                    </select>
                </div>
                <div>
                    <label for="currently">Currently</label>
                    <select id="currently" name="currently" required>
                        <option value="renting" {% if contact.currently == "renting" %}selected{% endif %}>Renting</option>
                        <option value="own" {% if contact.currently == "own" %}selected{% endif %}>Own</option>
                    </select>
                </div>
            </div>

            <div class="row-3">
                <div>
                    <label for="property_type">Property Type</label>
                    <select id="property_type" name="property_type">
                        <option value="single-family" {% if contact.property_type == "single-family" %}selected{% endif %}>Single Family</option>
                        <option value="condo" {% if contact.property_type == "condo" %}selected{% endif %}>Condo</option>
                        <option value="townhome" {% if contact.property_type == "townhome" %}selected{% endif %}>Townhome</option>
                        <option value="multi-family" {% if contact.property_type == "multi-family" %}selected{% endif %}>Multi-Family</option>
                        <option value="land" {% if contact.property_type == "land" %}selected{% endif %}>Land</option>
                        <option value="other" {% if contact.property_type == "other" %}selected{% endif %}>Other</option>
                    </select>
                </div>
                <div>
                    <label for="bedrooms">Bedrooms</label>
                    <input id="bedrooms" type="text" name="bedrooms" value="{{ contact.bedrooms }}" maxlength="10" placeholder="e.g. 3 or 3+">
                </div>
                <div>
                    <label for="preferred_areas">Preferred Areas</label>
                    <input id="preferred_areas" type="text" name="preferred_areas" value="{{ contact.preferred_areas }}" placeholder="Neighborhoods or cities">
                </div>
            </div>

            <label for="agent-id">Hosted By</label>
            <select id="agent-id" name="agent_id">
                <option value="">Unassigned</option>
                {% for agent in agents %}
                <option value="{{ agent[0] }}" {% if contact.agent_id == agent[0] %}selected{% endif %}>{{ agent[1] }}{% if agent[2] %} {{ agent[2] }}{% endif %} {{ agent[3] }}</option>
                {% endfor %}
            </select>

            <div class="row-3">
                <div>
                    <label for="visitor_type">Visitor Type</label>
                    <select id="visitor_type" name="visitor_type" required>
                        {% for value, label in [("buyer", "Buyer"), ("seller", "Seller"), ("renter", "Renter"), ("landlord", "Landlord"), ("expired", "Expired"), ("fsbo", "FSBO"), ("referral", "Referral"), ("open-house", "Open House"), ("past-client", "Past Client"), ("new-construction", "New Construction"), ("luxury", "Luxury"), ("investor", "Investor"), ("relocation", "Relocation")] %}
                        <option value="{{ value }}" {% if contact.visitor_type == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="timeline">Timeline</label>
                    <select id="timeline" name="timeline" required>
                        <option value="0-3" {% if contact.timeline == "0-3" %}selected{% endif %}>0-3 months</option>
                        <option value="3-6" {% if contact.timeline == "3-6" %}selected{% endif %}>3-6 months</option>
                        <option value="6-12" {% if contact.timeline == "6-12" %}selected{% endif %}>6-12 months</option>
                        <option value="browsing" {% if contact.timeline == "browsing" %}selected{% endif %}>Just browsing</option>
                    </select>
                </div>
                <div>
                    <label for="preapproval">Pre-approval</label>
                    <select id="preapproval" name="preapproval" required>
                        <option value="yes" {% if contact.preapproval == "yes" %}selected{% endif %}>Yes</option>
                        <option value="no" {% if contact.preapproval == "no" %}selected{% endif %}>No</option>
                        <option value="unknown" {% if contact.preapproval == "unknown" %}selected{% endif %}>Not sure</option>
                    </select>
                </div>
            </div>

            <label for="notes">Thank you for visiting message:</label>
            <textarea id="notes" name="notes" rows="5">{{ contact.notes }}</textarea>

            <div class="actions">
                <button type="submit">{% if is_new %}Create Contact{% else %}Save Contact{% endif %}</button>
                <a href="{{ url_for('contacts') }}">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
